name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Build installer and portable EXE
        run: npm run build:win

      - name: Package browser helper and checksums
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release create $env:GITHUB_REF_NAME `
            "dist/RemieGPT-Setup-$version-x64.exe" `
            "dist/RemieGPT-Portable-$version-x64.exe" `
            dist/RemieGPT-Browser-Helper.zip `
            dist/SHA256SUMS.txt `
            --verify-tag `
            --generate-notes `
            --title "RemieGPT $env:GITHUB_REF_NAME"
