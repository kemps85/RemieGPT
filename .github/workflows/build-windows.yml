name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Build installer and portable EXE
        run: npm run build:win

      - name: Package browser helper and checksums
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Upload Windows files
        uses: actions/upload-artifact@v7
        with:
          name: RemieGPT-Windows-x64
          path: |
            dist/*.exe
            dist/RemieGPT-Browser-Helper.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
